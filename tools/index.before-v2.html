let AC=null;
function tone(freqs,dur=.12,type='triangle',vol=.18){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;for(const f of freqs){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur*1.7);t+=dur}}catch(_){}}

/* 语音：audio/<字>.mp3 由 Fish Audio 预生成（见 tools/gen_audio.py）；文件缺失或离线时退回浏览器自带朗读 */
const AUDIO_DIR='audio/';const bufCache={};let curSrc=null,playToken=0;
const voiceOn=()=>S.voice!==false;
function ctx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
document.addEventListener('pointerdown',()=>{try{ctx()}catch(_){}});
function loadClip(key){if(!bufCache[key]){bufCache[key]=fetch(AUDIO_DIR+encodeURIComponent(key)+'.mp3').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(ab=>new Promise((ok,bad)=>ctx().decodeAudioData(ab,ok,bad)));bufCache[key].catch(()=>{delete bufCache[key]})}return bufCache[key]}
function preloadVoice(keys){for(const k of keys)loadClip(k).catch(()=>{})}
function stopVoice(){playToken++;if(curSrc){try{curSrc.stop()}catch(_){}curSrc=null}try{speechSynthesis.cancel()}catch(_){}}
function speakTTS(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>/zh[-_]CN/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(_){}}
function say(t,keys){
 if(!voiceOn())return;stopVoice();
 if(!keys)return speakTTS(t);
 keys=Array.isArray(keys)?keys:[keys];const my=playToken;let i=0;
 const next=()=>{if(my!==playToken||i>=keys.length){curSrc=null;return}const k=keys[i++];
  loadClip(k).then(buf=>{if(my!==playToken)return;const s=ctx().createBufferSource();s.buffer=buf;s.connect(AC.destination);s.onended=()=>{if(curSrc===s)curSrc=null;next()};curSrc=s;s.start()})
  .catch(()=>{if(my!==playToken)return;if(i===1)speakTTS(t);else next()})};
 next();
}

 const e=BY[c],G=GRADES[e.g],idx=G.items.indexOf(e),next=G.items[idx+1];
 const size=Math.max(260,Math.min(window.innerWidth-48,window.innerHeight-200,460)),pad=e.letter?10:22;
 const hl=e.letter?esc(e.l):esc(e.l).split(e.c).join(`<b>${e.c}</b>`);
 $('#main').innerHTML=`<button class="big ghost" data-go="grades" style="font-size:18px;padding:8px 14px;margin-bottom:12px">← ${G.name}</button>
 <div class="wwrap"><div><div class="board" style="width:${size+8}px;height:${size+8}px">${gridSVG(e,size,pad)}<div id="hw"></div></div>
  <div class="combo" id="combo">${Array.from({length:e.strokes},()=>'<span></span>').join('')}</div>
  <div class="msg" id="msg">先看一遍笔顺，再自己写！</div></div>
 <div class="info"><div style="display:flex;gap:16px;align-items:center"><div class="big-ch ${e.letter?'lat':''}">${esc(e.c)}</div>
  <div>${e.letter?'<div class="py">拼音字母</div>':`<div class="py">${esc(e.p)}</div><div class="da">${esc(e.da)}</div>`}<div class="src">${e.strokes} 笔　${TYPES[e.t].n}　No.${String(e.num).padStart(4,'0')}</div></div>
  <div style="margin-left:auto;width:84px">${starsOf(c)?mini(e,starsOf(c)):`<svg viewBox="0 0 200 200">${creatureSVG(e,1,{silhouette:true,silColor:'#C9D3E6'})}</svg>`}</div></div>
  <span class="kind" style="background:${KIND_COLOR[e.k]||'#8a8fae'}">${e.k}</span>
  <p class="poem">${hl}</p>${e.s?`<div class="src">${esc(e.s)}</div>`:''}
  <div class="ctrls"><button class="big ghost" id="bSay">🔊 听一听</button><button class="big" id="bAnim">👀 看笔顺</button><button class="big green" id="bQuiz">✏️ 开始写</button></div>
  ${next?`<div class="ctrls"><button class="big ghost" id="bNext" style="font-size:18px">下一个：${esc(next.c)}</button></div>`:''}
 </div></div>`;
 writer=HanziWriter.create('hw',c,{width:size,height:size,padding:pad,showOutline:true,showCharacter:false,strokeColor:TYPES[e.t].d,outlineColor:'#D9E1EE',drawingColor:'#2F6BFF',drawingWidth:e.letter?30:26,highlightColor:'#FFC72C',radicalColor:null,strokeAnimationSpeed:.9,delayBetweenStrokes:350,
  charDataLoader:loadChar,onLoadCharDataError:()=>{$('#msg').textContent='这个字的笔顺没有加载出来，请检查网络后再试'}});
 const sayText=e.letter?LETTER_SAY[e.c]+'，'+e.l.replace(/[a-zü ]+/g,''):e.c+'。'+e.l;
 try{ctx()}catch(_){}preloadVoice([e.c,'ui_start','ui_hint','ui_retry','ui_summon','ui_evolve']);if(next)preloadVoice([next.c]);
 $('#bSay').onclick=()=>say(sayText,e.c);
 $('#bAnim').onclick=()=>{clearTimeout(autoT);writer.cancelQuiz();writer.hideCharacter();writer.animateCharacter();$('#msg').textContent='看好每一笔的方向哦';say('看好每一笔的方向哦','ui_watch')};
 setTimeout(()=>say(sayText,e.c),250);
 $('#bQuiz').onclick=()=>startQuiz(e);
 if(next)$('#bNext').onclick=()=>go('write',next.c);
 autoT=setTimeout(()=>{try{writer.animateCharacter()}catch(_){}},400);
}
function startQuiz(e){
 clearTimeout(autoT);
 const dots=[...document.querySelectorAll('#combo span')];dots.forEach(d=>d.className='');
 let n=0;$('#msg').textContent='一笔一笔写，写对会变颜色';say('一笔一笔写，写对会变颜色','ui_start');
 writer.cancelQuiz();writer.hideCharacter();
 writer.quiz({leniency:e.letter?1.7:1.35,showHintAfterMisses:2,markStrokeCorrectAfterMisses:4,highlightOnComplete:true,acceptBackwardsStrokes:false,
  onCorrectStroke:d=>{dots[d.strokeNum].className=d.mistakesOnStroke?'bad':'on';sGood(n++);$('#msg').textContent=['真棒！','对啦！','好样的！','继续！'][n%4]},
  onMistake:d=>{sBad();const m=d.mistakesOnStroke>=2?'看，闪光的地方就是下一笔':'再试一次，注意从哪里开始写';$('#msg').textContent=m;if(d.mistakesOnStroke===1||d.mistakesOnStroke===2)say(m,d.mistakesOnStroke===2?'ui_hint':'ui_retry')},
  onComplete:d=>finish(e,d.totalMistakes)});
}
function finish(e,mist){
 const per=mist/Math.max(1,e.strokes);
 const stars=mist===0?3:(mist<=1||per<=.25)?(mist<=1&&e.strokes>=4?3:2):per<=.6?2:1;
 const p=me(),old=p.prog[e.c]||0,best=Math.max(old,stars);p.prog[e.c]=best;save();setNav('grades');
 sWin();const r=$('#hw').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,18);
 let title,sub,voice;
 if(!old){title=`召唤成功！`;sub=`你得到了 ${cname(e,best)}`;voice=['ui_summon','ui_star'+stars,e.c]}
 else if(best>old){title=`进化啦！`;sub=`${cname(e,old)} 变成了 ${cname(e,best)}`;voice=['ui_evolve','ui_star'+stars,e.c]}
 else if(stars<best){title=`这次 ${stars} 颗星`;sub=`你的 ${cname(e,best)} 还在卡册里。最好成绩不会变少`;voice=['ui_star'+stars,'ui_keep']}
 else{title=`又是 ${stars} 颗星！`;sub=best<3?`写到 3 颗星，它会进化成 ${cname(e,3)}`:`字灵大王为你骄傲`;voice=best<3?['ui_good'+(1+e.strokes%4),'ui_star'+stars]:['ui_again3']}
 setTimeout(()=>openCard(e,best,{title,sub,stars,after:true,voice}),700);
}
/* ---------- modal ---------- */
function openCard(e,f,o={}){
 const nx=GRADES[e.g].items[GRADES[e.g].items.indexOf(e)+1];
 $('#mbox').innerHTML=`<div class="title">${o.title||cname(e,f)}</div>${o.stars!==undefined?`<div style="font-size:34px;color:#FFC72C">${'★'.repeat(o.stars)}${'☆'.repeat(3-o.stars)}</div>`:''}
 <div class="cardwrap pop">${cardSVG(e,f,e.strokes,e.num,{uid:'m'})}</div>
 <div style="font-size:20px;margin-top:10px">${o.sub||''}</div>
 <div class="forms">${[1,2,3].map(k=>`<div title="${cname(e,k)}"><svg viewBox="0 0 200 200">${creatureSVG(e,k,{silhouette:k>f,silColor:'#3a4370'})}</svg><div style="font-size:14px">${k<=f?cname(e,k):'？？？'}</div></div>`).join('')}</div>
 <div class="mbtns">${o.after?`<button class="big ghost" id="mAgain">再写一次</button>${nx?`<button class="big green" id="mNext">下一个 ${esc(nx.c)}</button>`:''}`:`<button class="big" id="mWrite">去写 ${esc(e.c)}</button><button class="big ghost" id="mPrint">🖨 打印这张</button>`}<button class="big pink" id="mClose">关闭</button></div>`;
 $('#modal').classList.add('open');say(o.title||cname(e,f),o.voice||[e.c]);
 $('#mClose').onclick=closeModal;
 if($('#mAgain'))$('#mAgain').onclick=()=>{closeModal();startQuiz(e)};
 if($('#mNext'))$('#mNext').onclick=()=>go('write',nx.c);
 if($('#mWrite'))$('#mWrite').onclick=()=>go('write',e.c);
 if($('#mPrint'))$('#mPrint').onclick=()=>printCards([[e,f]]);
}
function closeModal(){$('#modal').classList.remove('open');stopVoice()}
$('#modal').addEventListener('click',ev=>{if(ev.target.id==='modal')closeModal()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
/* ---------- print ---------- */
function printCards(list){
 const box=$('#print');
 box.innerHTML=list.map(([e,f],i)=>`<div class="pcard">${cardSVG(e,f,e.strokes,e.num,{uid:'p'+i})}</div>`).join('');
 document.body.classList.add('printing');
 const done=()=>{document.body.classList.remove('printing');box.innerHTML='';window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);
 setTimeout(()=>{window.print();setTimeout(done,1500)},50);
}
/* ---------- album ---------- */
function album(gid){
 if(gid!==undefined){S.agrade=gid;save()}
 const p=me(),G=GRADES[S.agrade];
 const got=ALL.filter(e=>p.prog[e.c]).length,gold=ALL.filter(e=>p.prog[e.c]===3).length;
 const ggot=G.items.filter(e=>p.prog[e.c]);
 $('#main').innerHTML=`<h1>${esc(p.name)} 的卡册</h1><p class="muted">已收集 ${got} / ${ALL.length} 张，其中金卡 ${gold} 张。笔画多的字写到 3 颗星会变成闪卡。</p>
 <div class="prog"><i style="width:${got/ALL.length*100}%"></i></div>
 ${gradeTabs(S.agrade,'data-ag')}
 <div class="ctrls" style="margin:4px 0 14px"><span class="muted" style="align-self:center">${G.name}已收集 ${ggot.length} / ${G.items.length} 张</span>${ggot.length?`<button class="big ghost" id="aPrint" style="font-size:18px;padding:8px 14px">🖨 打印${G.name}的 ${ggot.length} 张卡</button>`:''}</div>
 <div class="album">${G.items.map(e=>{const f=p.prog[e.c];return f?`<button class="slot" data-c="${esc(e.c)}" aria-label="${cname(e,f)}">${cardSVG(e,f,e.strokes,e.num,{uid:'a'})}</button>`
  :`<button class="slot" data-c="${esc(e.c)}" aria-label="还没收集 ${esc(e.c)}"><div class="lockcard"><svg viewBox="0 0 200 200">${creatureSVG(e,1,{silhouette:true,silColor:'#9AA6C4'})}</svg>No.${String(e.num).padStart(4,'0')}</div></button>`}).join('')}</div>`;
 document.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>album(+b.dataset.ag));
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const e=BY[b.dataset.c],f=p.prog[e.c];f?openCard(e,f):go('write',e.c)});
 if($('#aPrint'))$('#aPrint').onclick=()=>printCards(ggot.map(e=>[e,p.prog[e.c]]));
}
/* ---------- poster ---------- */
function poster(){
 const best={};for(const p of Object.values(S.players))for(const[c,f]of Object.entries(p.prog))best[c]=Math.max(best[c]||0,f);
 const zones={sky:[30,20,740,150],fire:[790,40,190,190],wood:[20,260,330,190],earth:[370,260,280,190],water:[670,320,300,130],heart:[20,480,560,160],letter:[600,480,380,160]};
 const groups={};ALL.forEach(e=>{if(best[e.c])(groups[e.t]=groups[e.t]||[]).push(e)});
 let crit='';
 for(const[t,list]of Object.entries(groups)){const[x,y,w,h]=zones[t];let sz=80;while(sz>18&&Math.floor(w/sz)*Math.floor(h/sz)<list.length)sz-=2;const cols=Math.floor(w/sz);
  list.forEach((e,i)=>{const f=best[e.c];const cx=x+(i%cols)*sz+(Math.floor(i/cols)%2?sz/2:0)*(cols*sz+sz/2<=w?1:0),cy=y+Math.floor(i/cols)*sz;const sc=sz/200*(1+f*0.1);
   crit+=`<g transform="translate(${cx+sz/2-100*sc} ${cy+sz/2-110*sc}) scale(${sc})">${creatureSVG(e,f)}</g>`})}
 const got=Object.keys(best).length;
 const pl=Object.values(S.players);
 $('#main').innerHTML=`<h1>全班海报</h1><p class="muted">这台设备上 ${pl.length} 个小朋友一起召唤的字灵都住在这里。每一只都来自一个写对的字。</p>
 <div class="prog"><i style="width:${got/ALL.length*100}%"></i></div><p style="font-size:22px;margin:4px 0 12px">全班已经召唤 ${got} / ${ALL.length} 只</p>
 <div class="poster"><svg viewBox="0 0 1000 660">
  <rect width="1000" height="660" fill="#BFE6FF"/><circle cx="885" cy="135" r="90" fill="#FFE27A"/><circle cx="885" cy="135" r="64" fill="#FFD23F"/>
  <ellipse cx="200" cy="90" rx="110" ry="30" fill="#fff" opacity=".8"/><ellipse cx="560" cy="70" rx="130" ry="32" fill="#fff" opacity=".8"/>
  <path d="M0 300 Q180 210 360 290 T720 280 T1000 280 V660 H0Z" fill="#8FD98C"/>
  <path d="M380 300 l130 -110 l130 110Z" fill="#B88A5A"/><path d="M470 224 l40 -34 l40 34 l-20 10 l-20 -8 l-20 8Z" fill="#fff"/>
  ${[30,140,250].map(x=>`<rect x="${x+38}" y="300" width="18" height="90" fill="#8A5A2B"/><circle cx="${x+47}" cy="285" r="52" fill="#3FA65A" opacity=".55"/>`).join('')}
  <ellipse cx="820" cy="400" rx="175" ry="70" fill="#6CC3F5"/><ellipse cx="820" cy="392" rx="150" ry="52" fill="#9AD8FF"/>
  <path d="M0 470 Q250 440 500 470 T1000 465 V660 H0Z" fill="#5FC46E"/>
  <path d="M600 660 a190 190 0 0 1 380 0" fill="none" stroke="#FFB3C7" stroke-width="14" opacity=".7"/><path d="M620 660 a170 170 0 0 1 340 0" fill="none" stroke="#FFE27A" stroke-width="14" opacity=".7"/><path d="M640 660 a150 150 0 0 1 300 0" fill="none" stroke="#B5E7A8" stroke-width="14" opacity=".7"/>
  ${crit}
  ${got?'':`<text x="500" y="250" text-anchor="middle" font-size="34" font-family="${HAN_FONT}" fill="#1f2340">写对第一个字，第一只字灵就会搬进来</text>`}
 </svg></div>
 <div class="legend">${Object.entries(TYPES).map(([k,t])=>`<span style="background:${t.m}">${t.n} ${ALL.filter(e=>e.t===k&&best[e.c]).length}/${ALL.filter(e=>e.t===k).length}</span>`).join('')}</div>`;
}
/* ---------- boot ---------- */
$('#logoSvg').innerHTML=creatureSVG(BY['火']||ALL[0],2);
$('#snd').onclick=toggleVoice;$('#snd').textContent=voiceOn()?'🔊':'🔇';$('#snd').setAttribute('aria-pressed',voiceOn());
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(typeof HanziWriter==='undefined'){$('#main').innerHTML='<h1>写字工具没有加载出来</h1><p>请检查网络后刷新页面。</p>'}
else go(me()?'grades':'players');
</script>
</body></html>
