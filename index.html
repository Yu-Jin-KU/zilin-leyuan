.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.holo .holo-sheen{animation:sheen 3s linear infinite}
@keyframes sheen{0%{opacity:.15}50%{opacity:.55}100%{opacity:.15}}
.burst{position:fixed;pointer-events:none;font-size:30px;z-index:30;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
/* poster */
.poster{background:var(--paper);border-radius:26px;border:4px solid var(--line);overflow:hidden}
.poster svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend span{border-radius:999px;padding:4px 12px;color:#fff;font-size:16px}
@media (max-width:520px){.logo{font-size:20px}.logo svg{width:30px;height:30px}.nav button,.who{font-size:15px;padding:6px 10px}.bar{gap:6px;padding:8px 10px}h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){.pop,.burst,.holo .holo-sheen{animation:none}}
@media print{@page{size:A4;margin:0}body.printing{background:#fff}body.printing>*{display:none!important}body.printing #print{display:grid!important}#print{display:none;grid-template-columns:repeat(3,63mm);gap:3mm;padding:7.5mm;background:#fff}.pcard{width:63mm;height:88mm;break-inside:avoid}.pcard svg{width:63mm;height:88mm;display:block}}
@media screen{#print{display:none}}
@page{size:A4;margin:8mm}

const LETTER_CACHE={};
function tfPath(p,tx,ty){let i=0;return p.replace(/-?\d+(?:\.\d+)?|[A-Za-z]/g,t=>{if(/[A-Za-z]/.test(t)){i=0;return t}const v=parseFloat(t);return String(Math.round(((i++%2===0)?tx(v):ty(v))*10)/10)})}
function letterData(str){
 if(HDATA[str])return HDATA[str];
 if(LETTER_CACHE[str])return LETTER_CACHE[str];
 const parts=[...str].map(ch=>HDATA[ch]).filter(Boolean);
 const bbox=d=>{let a=1e9,b=-1e9;for(const m of d.medians)for(const [x] of m){a=Math.min(a,x);b=Math.max(b,x)}return [a,b]};
 const bs=parts.map(bbox),GAP=80,BASE=260;let total=GAP*(parts.length-1);bs.forEach(([a,b])=>total+=b-a);
 const s=Math.min(1,900/total);let x=(1024-total*s)/2;const strokes=[],medians=[];
 parts.forEach((d,i)=>{const [a,b]=bs[i];const dx=x-a*s;const tx=v=>v*s+dx,ty=v=>BASE+(v-BASE)*s;
  for(const p of d.strokes)strokes.push(tfPath(p,tx,ty));
  for(const m of d.medians)medians.push(m.map(([px,py])=>[Math.round(tx(px)),Math.round(ty(py))]));
  x+=(b-a)*s+GAP*s});
 return LETTER_CACHE[str]={strokes,medians};
}

const FINALS=PINYIN.groups.filter(g=>/韵母/.test(g.name)).flatMap(g=>g.items);
const WHOLE=(PINYIN.groups.find(g=>/整体/.test(g.name))||{items:[]}).items;
const DETONE=s=>s.replace(/[āáǎà]/g,'a').replace(/[ēéěè]/g,'e').replace(/[īíǐì]/g,'i').replace(/[ōóǒò]/g,'o').replace(/[ūúǔù]/g,'u').replace(/[ǖǘǚǜ]/g,'ü').replace(/[ńňǹ]/g,'n');
const toned=p=>p.split('/')[0].split(',')[0].trim();
function splitPy(p){const t=DETONE(toned(p).toLowerCase());const ini=INITIALS.find(i=>t.startsWith(i))||'';return {ini,fin:t.slice(ini.length),full:t}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const uniqBy=(a,f)=>{const s=new Set();return a.filter(x=>{const k=f(x);if(s.has(k))return false;s.add(k);return true})};
function peers(e){
 if(e.letter){const g=PINYIN.groups.find(g=>g.items.includes(e.c));const same=(g?g.items:[]).filter(c=>c!==e.c).map(c=>BY[c]);return same.length>=3?same:GRADES[0].items.filter(x=>x.letter&&x!==e)}
 const same=GRADES[e.g].items.filter(x=>!x.letter&&x!==e);return same.length>=3?same:ALL.filter(x=>!x.letter&&x!==e)}
const EARLY=()=>ALL.filter(x=>!x.letter&&x.g<=3);
function pyRole(k){return WHOLE.includes(k)?'whole':INITIALS.includes(k)?'ini':'fin'}
function fillTargets(e){const role=pyRole(e.c);return EARLY().filter(x=>{const s=splitPy(x.p);return role==='whole'?s.full===e.c:role==='ini'?s.ini===e.c:s.fin===e.c&&s.ini})}
function mazeGood(e){if(!e.letter)return [e.c];const t=uniqBy(fillTargets(e).map(x=>toned(x.p)),x=>x);return t.length?t:[e.c]}

function inkMask(ch,N){const cv=document.createElement('canvas');const R=N*12;cv.width=cv.height=R;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,R,R);g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';

 const d=g.getImageData(0,0,R,R).data;const mask=new Set();
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){let ink=0;for(let y=0;y<12;y++)for(let x=0;x<12;x++){const i=((r*12+y)*R+(c*12+x))*4;if(d[i]<128)ink++}if(ink>=22)mask.add(r*N+c)}

  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const card=b.closest('.libc');let ph=card.querySelector('.libp');if(!ph){ph=document.createElement('div');ph.className='libp';card.insertBefore(ph,card.firstChild)}
   const img=card.querySelector('img');if(img)img.remove();ph.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.play}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="视频"></iframe>`;stopMusic()})})}
/* ---------- print ---------- */
function printCards(list){
 const box=$('#print');
 box.innerHTML=list.map(([e,f],i)=>`<div class="pcard">${charCardSVG(e,f,{uid:'p'+i})}</div>`).join('');
 document.body.classList.add('printing');
 const done=()=>{document.body.classList.remove('printing');box.innerHTML='';window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);
 setTimeout(()=>{window.print();setTimeout(done,1500)},50);
}
/* ---------- album ---------- */
function album(gid){
 if(gid!==undefined){S.agrade=gid;save()}
 const p=me(),G=GRADES[S.agrade];
 const got=ALL.filter(e=>p.prog[e.c]).length,gold=ALL.filter(e=>p.prog[e.c]===3).length;
 const ggot=G.items.filter(e=>p.prog[e.c]);
 const tribesMode=S.atab==='tribes';const hatched=TRIBES.filter(t=>tribeStats(p,t).stage>0).length;
 $('#main').innerHTML=`<h1>${esc(p.name)} 的卡册</h1><div class="viewsw"><button data-atab="cards" aria-pressed="${!tribesMode}">字卡 ${got}</button><button data-atab="tribes" aria-pressed="${tribesMode}">部落 ${hatched} / ${TRIBES.length}</button></div>`+(tribesMode?`<p class="muted">每写对一个字，就是喂了它所属部落的字灵一口。喂 ${STAGES[0]} 个孵化，${STAGES[1]} 个进化，${STAGES[2]} 个变成大王；集齐部落里所有部首徽章，就是族长。</p>
 <div class="tribes">${TRIBES.map(t=>{const st=tribeStats(p,t);return `<div class="tcard" style="--c:${TYPES[t.type].m}"><div class="mascot">${tribeArt(t,st.stage,st)}</div><b>${t.emoji} ${esc(t.name)}</b><div class="src">${esc(tname(t,st.stage))} · 已喂 ${st.fed} / ${st.total}</div><div class="prog"><i style="width:${Math.min(100,st.fed/st.goal*100)}%"></i></div><div class="badges">${t.radList.slice(0,14).map(r=>`<span class="${st.badges.has(r)?'on':''}" title="部首 ${esc(r)}">${esc(r)}</span>`).join('')}${t.radList.length>14?`<span>+${t.radList.length-14}</span>`:''}</div><button class="big ghost" data-tribe="${t.id}" style="font-size:16px;padding:6px 12px">去写${esc(t.name)}的字</button></div>`}).join('')}</div>`:`<p class="muted">已收集 ${got} / ${ALL.length} 张，其中三星卡 ${gold} 张。笔画越多的字，卡框越稀有：普通、稀有、史诗、传说。</p>
 <div class="prog"><i style="width:${got/ALL.length*100}%"></i></div>`);
 if(tribesMode){document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{S.atab=b.dataset.atab;save();album()});document.querySelectorAll('[data-tribe]').forEach(b=>b.onclick=()=>{S.tfb=b.dataset.tribe;S.tf=null;S.view='grade';save();go('grades')});return}
 $('#main').innerHTML+=`
 ${Object.keys(p.art||{}).length?`<h2>🎨 我的画 <small class="muted">${Object.keys(p.art).length} 幅，点一幅可以再画或删除</small></h2><div class="arts">${Object.entries(p.art).map(([c,src])=>`<button data-art="${esc(c)}"><img src="${src}" alt="${esc(c)}"><small>${esc(c)}　${esc((BY[c]||{}).l||'')}</small></button>`).join('')}</div>`:''}
 ${gradeTabs(S.agrade,'data-ag')}
 <div class="ctrls" style="margin:4px 0 14px"><span class="muted" style="align-self:center">${G.name}已收集 ${ggot.length} / ${G.items.length} 张</span>${ggot.length?`<button class="big ghost" id="aPrint" style="font-size:18px;padding:8px 14px">🖨 打印${G.name}的 ${ggot.length} 张卡</button>`:''}</div>
 <div class="album">${G.items.map(e=>{const f=p.prog[e.c];return f?`<button class="slot" data-c="${esc(e.c)}" aria-label="${cname(e,f)}">${charCardSVG(e,f,{uid:'a'})}</button>`
  :`<button class="slot" data-c="${esc(e.c)}" aria-label="还没收集 ${esc(e.c)}"><div class="lockcard"><div class="${e.letter?'lat':''}" style="font-size:54px;opacity:.3;line-height:1.1">${esc(e.c)}</div>No.${String(e.num).padStart(4,'0')}</div></button>`}).join('')}</div>`;
 document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{S.atab=b.dataset.atab;save();album()});
 document.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>album(+b.dataset.ag));
 document.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>go('draw',b.dataset.art));
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const e=BY[b.dataset.c],f=p.prog[e.c];f?openCard(e,f):go('write',e.c)});
 if($('#aPrint'))$('#aPrint').onclick=()=>printCards(ggot.map(e=>[e,p.prog[e.c]]));
}
/* ---------- poster ---------- */
function poster(){
 const best={};for(const p of Object.values(S.players))for(const[c,f]of Object.entries(p.prog))best[c]=Math.max(best[c]||0,f);
 const zones={sky:[30,20,740,150],fire:[790,40,190,190],wood:[20,260,330,190],earth:[370,260,280,190],water:[670,320,300,130],heart:[20,480,560,160],letter:[600,480,380,160]};
 const classP={prog:best};let crit='';
 for(const [ty,[x,y,w,h]] of Object.entries(zones)){const ts=TRIBES.filter(t=>t.type===ty);const n=ts.length;if(!n)continue;
  ts.forEach((t,i)=>{const st=tribeStats(classP,t);const sz=Math.min(h,w/n,70+st.stage*22);const cx=x+(i+.5)*w/n,cy=y+h/2;const sc=sz/200;
   crit+=`<g class="pc" data-tribe="${t.id}" transform="translate(${cx-100*sc} ${cy-100*sc}) scale(${sc})"><title>${esc(t.name)} · ${esc(tname(t,st.stage))} · 已喂 ${st.fed}</title>${tribeInner(t,st.stage,st)}</g><text x="${cx}" y="${cy+sz/2+16}" text-anchor="middle" font-size="15" font-family="${HAN_FONT}" fill="#1f2340">${esc(t.name)}</text>`})}
 const got=Object.keys(best).length;const hatchedN=TRIBES.filter(t=>tribeStats(classP,t).stage>0).length;
 const pl=Object.values(S.players);
 const solo=pl.length===1,many=pl.length>=6;
 $('#main').innerHTML=`<h1>${solo?esc(pl[0].name)+' 的':many?'全班的':'我们的'}字灵王国</h1><p class="muted">${solo?`${TRIBES.length} 个部落都住在这里。你写对的字越多，字灵长得越大。把网址发给同学，他们也能养自己的王国。`:`这台设备上 ${pl.length} 个小朋友一起喂养的 ${TRIBES.length} 个部落都住在这里。大家写对的字越多，字灵长得越大。`}</p>
 <div class="prog"><i style="width:${got/ALL.length*100}%"></i></div><p style="font-size:22px;margin:4px 0 12px">${solo?'你已经':many?'全班一起':'大家一起'}写对 ${got} 个字，${hatchedN} / ${TRIBES.length} 个部落已孵化</p>
 <div class="poster"><svg viewBox="0 0 1000 660">
  <rect width="1000" height="660" fill="#BFE6FF"/><circle cx="885" cy="135" r="90" fill="#FFE27A"/><circle cx="885" cy="135" r="64" fill="#FFD23F"/>
  <ellipse cx="200" cy="90" rx="110" ry="30" fill="#fff" opacity=".8"/><ellipse cx="560" cy="70" rx="130" ry="32" fill="#fff" opacity=".8"/>
  <path d="M0 300 Q180 210 360 290 T720 280 T1000 280 V660 H0Z" fill="#8FD98C"/>
  <path d="M380 300 l130 -110 l130 110Z" fill="#B88A5A"/><path d="M470 224 l40 -34 l40 34 l-20 10 l-20 -8 l-20 8Z" fill="#fff"/>
  ${[30,140,250].map(x=>`<rect x="${x+38}" y="300" width="18" height="90" fill="#8A5A2B"/><circle cx="${x+47}" cy="285" r="52" fill="#3FA65A" opacity=".55"/>`).join('')}
  <ellipse cx="820" cy="400" rx="175" ry="70" fill="#6CC3F5"/><ellipse cx="820" cy="392" rx="150" ry="52" fill="#9AD8FF"/>
  <path d="M0 470 Q250 440 500 470 T1000 465 V660 H0Z" fill="#5FC46E"/>
  <path d="M600 660 a190 190 0 0 1 380 0" fill="none" stroke="#FFB3C7" stroke-width="14" opacity=".7"/><path d="M620 660 a170 170 0 0 1 340 0" fill="none" stroke="#FFE27A" stroke-width="14" opacity=".7"/><path d="M640 660 a150 150 0 0 1 300 0" fill="none" stroke="#B5E7A8" stroke-width="14" opacity=".7"/>
  ${crit}
  ${got?'':`<text x="500" y="250" text-anchor="middle" font-size="34" font-family="${HAN_FONT}" fill="#1f2340">写对第一个字，第一只字灵就会搬进来</text>`}
 </svg></div>
 <div class="legend">${Object.entries(TYPES).map(([k,t])=>`<button data-tf="${k}" style="background:${t.m}" title="去写${t.n}的字">${t.n} ${ALL.filter(e=>e.t===k&&best[e.c]).length}/${ALL.filter(e=>e.t===k).length}</button>`).join('')}</div>
 <p class="muted">点一只字灵去写它部落的字；点下面的字系，去写那一系的字。</p>`;
 $('.poster svg').addEventListener('click',ev=>{const g=ev.target.closest('[data-tribe]');if(!g)return;S.tfb=g.dataset.tribe;S.tf=null;S.view='grade';save();go('grades')});
 document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{S.tf=b.dataset.tf;S.view='grade';save();go('grades')});
}
/* ---------- boot ---------- */
$('#logoSvg').innerHTML=creatureSVG(BY['火']||ALL[0],2);
fetch('data/meaning.json').then(r=>r.ok?r.json():{}).then(j=>Object.assign(MEAN,j)).catch(()=>{});
fetch('art/manifest.json').then(r=>r.ok?r.json():[]).then(list=>{for(const k of list)ART.add(k)}).catch(()=>{});
const FINE=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
if(new URLSearchParams(location.search).get('teacher')==='1'){try{localStorage.setItem('zilin_testvoice','1')}catch(_){}}
if(TESTV())document.querySelectorAll('#sndmenu .testv').forEach(b=>b.hidden=false);
$('#snd').onclick=ev=>{ev.stopPropagation();$('#sndmenu').hidden=!$('#sndmenu').hidden};
document.querySelectorAll('#sndmenu [data-vk]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();setVoice(b.dataset.vk)});
document.querySelectorAll('#sndmenu [data-music]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.music===musicMode());b.onclick=ev=>{ev.stopPropagation();setMusic(b.dataset.music)}});
document.addEventListener('click',()=>{$('#sndmenu').hidden=true});
setVoice(voiceOn()?voiceKind():'off');
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(typeof HanziWriter==='undefined'){$('#main').innerHTML='<h1>写字工具没有加载出来</h1><p>请检查网络后刷新页面。</p>'}
else if(/[?&]print=(\d+)/.test(location.search)){/* 导出打印版 PDF：index.html?print=300 → 前 300 号字卡（三星）铺在 #print 里，不弹打印框，由无头 Chrome 打印 */
 const N=+RegExp.$1;const list=ALL.filter(e=>e.num<=N).sort((a,b)=>a.num-b.num);
 $('#print').innerHTML=list.map((e,i)=>`<div class="pcard">${charCardSVG(e,3,{uid:'p'+i})}</div>`).join('');document.body.classList.add('printing');document.title='字灵卡 '+list.length+' 张'}
else{const P=new URLSearchParams(location.search);const famParam=P.get('fam'),clsParam=P.get('cls'),cardsParam=P.get('cards');
 if(SYNC_API&&famParam&&/^[A-Z2-9]{8}$/i.test(famParam)){history.replaceState(null,'',location.pathname);joinFamily(famParam.toUpperCase()).then(r=>{go('players');if(r!==true&&$('#fammsg'))$('#fammsg').textContent=r})}
 else if(SYNC_API&&clsParam&&/^[A-Z2-9]{8}$/i.test(clsParam)){history.replaceState(null,'',location.pathname);S.clsPending=clsParam.toUpperCase();rawSave();go('players');parentGuide({cls:S.clsPending});scheduleSync()}/* 老师发的加入链接 */
 else if(cardsParam){history.replaceState(null,'',location.pathname);go(me()?'grades':'players');const list=[...new Set([...cardsParam.replace(/[a-zü]+/g,'')].concat(cardsParam.match(/[a-zü]+/g)||[]))].map(c=>BY[c]).filter(Boolean);if(list.length)setTimeout(()=>printCards(list.map(e=>[e,3])),600)}/* 老师版：打印这些字的字卡 */
 else{go(me()?'grades':'players');scheduleSync()}
 tickPlay()}
</script>
</body></html>
